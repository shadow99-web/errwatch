[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "errwatch"
version = "1.3.0"
description = "Drop-in self-debugging error reporter for Discord bots and Python scripts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "shadow99-web"},
]
keywords = ["discord", "error-reporting", "webhook", "debugging", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.0.0"]
metrics = ["psutil>=5.9.0"]

[project.urls]
Homepage = "https://github.com/shadow99-web/errwatch"
Issues   = "https://github.com/shadow99-web/errwatch/issues"

[tool.setuptools]
py-modules = ["errwatch"]
